services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - POSTGRES_URL=postgresql+asyncpg://csuser:cspass@postgres:5432/customer_service
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn src.ai_customer_service.app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    working_dir: /app

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: csuser
      POSTGRES_PASSWORD: cspass
      POSTGRES_DB: customer_service
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U csuser -d customer_service"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Optional self-hosted Langfuse — enable with: docker compose --profile observability up
  langfuse:
    image: langfuse/langfuse:2
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://csuser:cspass@postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: change-me-in-production
      SALT: change-me-in-production
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["observability"]

volumes:
  postgres_data:
  redis_data:

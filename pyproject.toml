[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-customer-service"
version = "0.1.0"
description = "LangGraph-based AI customer service system with Clean Architecture"
requires-python = ">=3.11"

dependencies = [
    # LangGraph core + checkpointers
    "langgraph>=0.2.70",
    "langgraph-checkpoint-redis>=0.0.6",
    "langgraph-checkpoint-postgres>=2.0.7",
    # LangChain adapters
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.3.0",
    "langchain-ollama>=0.2.0",
    # FastAPI + server
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Config
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    # Database
    "asyncpg>=0.30.0",
    "pgvector>=0.3.6",
    "psycopg[binary,pool]>=3.2.0",
    # Redis
    "redis[asyncio]>=5.2.0",
    # Observability
    "langfuse>=2.36.0",
    # Retrieval
    "rank-bm25>=0.2.2",
    "httpx>=0.27.0",
    # WebSocket / Workspace
    "python-socketio[asyncio_client]>=5.11.0",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.29",
]

[project.optional-dependencies]
reranker = [
    "FlagEmbedding>=1.2.0",
]
local-embed = [
    "fastembed>=0.4.0",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27.0",
    "testcontainers[postgres,redis]>=4.8",
    "ruff>=0.7.0",
    "mypy>=1.13",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
]
